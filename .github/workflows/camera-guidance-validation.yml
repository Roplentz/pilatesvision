name: Camera guidance validation

on:
  push:
    branches:
      - agent/camera-guidance-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check camera component format
        run: bunx prettier --check src/components/PoseCapture.tsx

      - name: Lint camera component
        run: bunx eslint src/components/PoseCapture.tsx

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test:run

      - name: Build
        run: bun run build
