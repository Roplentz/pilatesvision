<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">PilatesVision exercise schematic reference sheet</title>
  <desc id="desc">Prancha esquemática própria com referências visuais simplificadas para exercícios de Pilates.</desc>
  <style>
    .bg{fill:#f6f8fb}.card{fill:#ffffff;stroke:#d8dee9;stroke-width:2}.label{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#243447}.sub{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#607080}.line{fill:none;stroke:#1f2937;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#1f2937;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.equip{fill:none;stroke:#009da6;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.joint{fill:#1f2937}.accent{fill:none;stroke:#009da6;stroke-width:4;stroke-dasharray:8 8}.floor{stroke:#9aa4b2;stroke-width:4}.warn{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#7b8a9e}
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="1600"/>
  <text x="60" y="58" class="label" style="font-size:30px">PilatesVision — referências esquemáticas de exercícios</text>
  <text x="60" y="88" class="sub">Imagens próprias para apoio visual interno. Não substituem demonstração, avaliação ou supervisão profissional.</text>

  <!-- card helper dimensions: x 50/430/810, y 130 + 350 rows -->

  <g id="mat_hundred">
    <rect class="card" x="50" y="130" width="320" height="300" rx="22"/>
    <text x="75" y="170" class="label">Cem</text><text x="75" y="194" class="sub">Mat | core + respiração</text>
    <line x1="85" y1="360" x2="335" y2="360" class="floor"/>
    <circle cx="148" cy="282" r="18" class="joint"/>
    <path class="line" d="M165 288 C195 300 220 310 248 313"/>
    <path class="line" d="M220 310 L295 265"/>
    <path class="line" d="M220 310 L300 342"/>
    <path class="thin" d="M198 306 L120 325 M203 318 L125 344"/>
    <path class="accent" d="M112 320 L112 350 M132 314 L132 354"/>
    <text x="75" y="404" class="warn">Monitorar: cervical, pelve, altura das pernas</text>
  </g>

  <g id="mat_roll_up">
    <rect class="card" x="430" y="130" width="320" height="300" rx="22"/>
    <text x="455" y="170" class="label">Roll Up</text><text x="455" y="194" class="sub">Mat | mobilidade segmentar</text>
    <line x1="465" y1="360" x2="715" y2="360" class="floor"/>
    <circle cx="548" cy="250" r="17" class="joint"/>
    <path class="line" d="M560 265 C585 290 605 318 625 350"/>
    <path class="line" d="M622 350 L700 350"/>
    <path class="thin" d="M574 282 L505 260 M578 286 L514 302"/>
    <path class="accent" d="M548 280 C575 300 595 328 606 352"/>
    <text x="455" y="404" class="warn">Monitorar: impulso, flexão coluna, pés</text>
  </g>

  <g id="mat_pelvic_curl">
    <rect class="card" x="810" y="130" width="320" height="300" rx="22"/>
    <text x="835" y="170" class="label">Ponte articulada</text><text x="835" y="194" class="sub">Mat | quadril + coluna</text>
    <line x1="845" y1="360" x2="1095" y2="360" class="floor"/>
    <circle cx="898" cy="340" r="16" class="joint"/>
    <path class="line" d="M915 338 C955 290 1000 290 1040 338"/>
    <path class="line" d="M1040 338 L1088 360"/>
    <path class="line" d="M915 338 L870 360"/>
    <path class="thin" d="M960 298 L930 270 M970 295 L1000 270"/>
    <path class="accent" d="M915 338 C958 270 1000 270 1040 338"/>
    <text x="835" y="404" class="warn">Monitorar: simetria pélvica, joelhos, altura</text>
  </g>

  <g id="mat_swan_prep">
