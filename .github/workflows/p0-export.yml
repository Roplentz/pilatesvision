name: P0 Normalize Branch

on:
  push:
    branches:
      - agent/p0-stabilization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-stabilization
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - name: Refresh dependency lock
        run: bun install
      - name: Normalize repository formatting
        run: bun run format
      - name: Remove temporary workflow
        run: rm .github/workflows/p0-export.yml
      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git commit -m "chore: normalize formatting and refresh lockfile"
          git push origin HEAD:agent/p0-stabilization
