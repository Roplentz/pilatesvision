name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.42"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint:check
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test:run
      - name: Build
        run: bun run build

  supabase-local:
    name: Supabase clean bootstrap and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase with Docker
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      - name: Rebuild empty database from migrations
        run: supabase db reset --local
      - name: Run multi-clinic RLS integration test
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_isolation.sql
      - name: Show local status on failure
        if: failure()
        run: supabase status || true
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
