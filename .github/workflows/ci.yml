name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint:check
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test:run
      - name: Build
        run: bun run build

  clinical-journey:
    name: Supabase, RLS and clinical journey
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Docker diagnostics
        run: |
          docker version
          docker info
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      - name: Rebuild empty database from migrations
        run: supabase db reset --local
      - name: Run multi-clinic RLS integration test
        env:
          PGPASSWORD: postgres
        run: >-
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1
          -f supabase/tests/rls_isolation.sql
      - name: Export local Supabase credentials
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run recorded E2E journey
        run: bun run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Show local status on failure
        if: failure()
        run: supabase status || true
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
