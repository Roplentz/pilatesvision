    <text x="75" y="520" class="label">Swan Prep</text><text x="75" y="544" class="sub">Mat | extensão torácica</text>
    <line x1="85" y1="710" x2="335" y2="710" class="floor"/>
    <circle cx="145" cy="646" r="17" class="joint"/>
    <path class="line" d="M160 655 C200 680 245 695 300 705"/>
    <path class="thin" d="M190 670 L160 705 M205 677 L185 710"/>
    <path class="line" d="M265 700 L325 670"/>
    <path class="accent" d="M165 662 C205 625 250 635 302 675"/>
    <text x="75" y="754" class="warn">Monitorar: lombar, escápulas, cervical</text>
  </g>

  <g id="mat_side_kick">
    <rect class="card" x="430" y="480" width="320" height="300" rx="22"/>
    <text x="455" y="520" class="label">Side Kick</text><text x="455" y="544" class="sub">Mat | quadril + pelve</text>
    <line x1="465" y1="710" x2="715" y2="710" class="floor"/>
    <circle cx="512" cy="663" r="16" class="joint"/>
    <path class="line" d="M528 670 L610 700"/>
    <path class="line" d="M610 700 L705 700"/>
    <path class="line" d="M610 700 L690 635"/>
    <path class="thin" d="M535 675 L490 700"/>
    <path class="accent" d="M610 700 C640 650 670 630 700 620"/>
    <text x="455" y="754" class="warn">Monitorar: rotação pélvica, amplitude, tronco</text>
  </g>

  <g id="mat_plank">
    <rect class="card" x="810" y="480" width="320" height="300" rx="22"/>
    <text x="835" y="520" class="label">Prancha</text><text x="835" y="544" class="sub">Mat | estabilidade global</text>
    <line x1="845" y1="710" x2="1095" y2="710" class="floor"/>
    <circle cx="885" cy="635" r="16" class="joint"/>
    <path class="line" d="M900 642 L1010 672 L1085 710"/>
    <path class="line" d="M930 650 L875 710"/>
    <path class="line" d="M1010 672 L1030 710"/>
    <path class="accent" d="M900 642 L1010 672 L1085 710"/>
    <text x="835" y="754" class="warn">Monitorar: linha corporal, escápulas, pelve</text>
  </g>

  <g id="ref_footwork">
    <rect class="card" x="50" y="830" width="320" height="300" rx="22"/>
    <text x="75" y="870" class="label">Footwork</text><text x="75" y="894" class="sub">Reformer | MMII</text>
    <rect x="100" y="1035" width="210" height="18" class="equip" rx="7"/>
    <line x1="320" y1="945" x2="320" y2="1068" class="equip"/>
    <circle cx="135" cy="985" r="16" class="joint"/>
    <path class="line" d="M150 995 L210 1035 L275 1010 L320 965"/>
    <path class="thin" d="M180 1005 L140 1045"/>
    <path class="accent" d="M225 1008 L270 1008"/>
    <text x="75" y="1104" class="warn">Monitorar: valgo, simetria, retorno excêntrico</text>
  </g>

  <g id="ref_leg_circles">
    <rect class="card" x="430" y="830" width="320" height="300" rx="22"/>
    <text x="455" y="870" class="label">Leg Circles</text><text x="455" y="894" class="sub">Reformer | quadril</text>
    <rect x="480" y="1035" width="210" height="18" class="equip" rx="7"/>
    <circle cx="525" cy="1002" r="16" class="joint"/>
    <path class="line" d="M540 1010 L595 1035"/>
    <path class="line" d="M595 1035 L650 955"/>
    <path class="line" d="M595 1035 L705 970"/>
    <ellipse cx="675" cy="965" rx="46" ry="30" class="accent"/>
    <text x="455" y="1104" class="warn">Monitorar: trajetória, pelve, amplitude</text>
  </g>

  <g id="ref_scooter">
    <rect class="card" x="810" y="830" width="320" height="300" rx="22"/>
    <text x="835" y="870" class="label">Scooter</text><text x="835" y="894" class="sub">Reformer | unilateral</text>
    <rect x="860" y="1042" width="210" height="18" class="equip" rx="7"/>
    <circle cx="930" cy="945" r="16" class="joint"/>
    <path class="line" d="M930 962 L948 1005 L930 1058"/>
    <path class="line" d="M948 1005 L1020 1048"/>
    <path class="thin" d="M938 970 L910 1010 M940 972 L965 1010"/>
    <path class="accent" d="M950 1005 L1020 1048"/>
    <text x="835" y="1104" class="warn">Monitorar: joelho-pé, pelve, equilíbrio</text>
  </g>

  <g id="cad_leg_springs">
    <rect class="card" x="50" y="1180" width="320" height="300" rx="22"/>
    <text x="75" y="1220" class="label">Leg Springs</text><text x="75" y="1244" class="sub">Cadillac | quadril</text>
    <line x1="85" y1="1408" x2="335" y2="1408" class="floor"/>
    <line x1="320" y1="1270" x2="320" y2="1430" class="equip"/>
    <circle cx="130" cy="1370" r="16" class="joint"/>
    <path class="line" d="M145 1380 L205 1405"/>
    <path class="line" d="M205 1405 L280 1320 M205 1405 L300 1362"/>
    <path class="equip" d="M320 1290 L280 1320 M320 1310 L300 1362"/>
    <text x="75" y="1454" class="warn">Monitorar: pelve, simetria, retorno das molas</text>
  </g>

  <g id="chair_footwork">
    <rect class="card" x="430" y="1180" width="320" height="300" rx="22"/>
    <text x="455" y="1220" class="label">Chair Footwork</text><text x="455" y="1244" class="sub">Chair | MMII</text>
    <rect x="520" y="1345" width="120" height="70" class="equip" rx="10"/>
    <line x1="640" y1="1412" x2="705" y2="1450" class="equip"/>
    <circle cx="575" cy="1295" r="16" class="joint"/>
    <path class="line" d="M575 1312 L580 1350"/>
    <path class="line" d="M580 1350 L635 1405 L700 1450"/>
    <path class="thin" d="M577 1325 L540 1355 M580 1325 L615 1358"/>
    <text x="455" y="1454" class="warn">Monitorar: postura, joelhos, controle pedal</text>
  </g>

  <g id="barrel_swan">
    <rect class="card" x="810" y="1180" width="320" height="300" rx="22"/>
    <text x="835" y="1220" class="label">Swan no Barrel</text><text x="835" y="1244" class="sub">Barrel | extensão</text>
    <path d="M885 1410 C905 1340 1010 1340 1030 1410 Z" class="equip"/>
    <circle cx="900" cy="1315" r="16" class="joint"/>
    <path class="line" d="M915 1324 C955 1340 990 1365 1025 1398"/>
    <path class="line" d="M1000 1378 L1080 1348"/>
    <path class="thin" d="M940 1340 L900 1378 M945 1344 L930 1395"/>
    <path class="accent" d="M915 1324 C950 1280 1005 1310 1040 1365"/>
    <text x="835" y="1454" class="warn">Monitorar: extensão torácica vs lombar</text>
  </g>

  <text x="60" y="1560" class="sub">PilatesVision v0.1 — arte esquemática própria para documentação e protótipo. Revisar com equipe clínica antes de uso final.</text>
</svg>
