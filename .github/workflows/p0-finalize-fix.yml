name: Apply assessment finalization refresh fix

on:
  push:
    branches:
      - agent/p0-stabilization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-stabilization
          fetch-depth: 0
      - name: Patch assessment finalization refresh
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routes/_authenticated.avaliacoes.$id.tsx")
          text = path.read_text()
          text = text.replace(
              '  const navigate = useNavigate();\n  const { assessment, loading } = useAssessment(id);',
              '  const { assessment, loading } = useAssessment(id);',
              1,
          )
          old = '      navigate({ to: "/avaliacoes/$id", params: { id: assessment.id }, replace: true });'
          new = '      window.location.reload();'
          if old not in text:
              raise SystemExit("Expected finalization navigation snippet not found")
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/p0-finalize-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refresh assessment after finalization"
          git push origin HEAD:agent/p0-stabilization
