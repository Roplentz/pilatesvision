name: FMIP shadow format diagnostic

on:
  pull_request:
    branches:
      - feat/fmip-squat-live-adapter
    paths:
      - ".github/workflows/fmip-shadow-format-debug.yml"
      - "src/lib/fmipShadow.ts"

permissions:
  contents: read

jobs:
  print-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - run: bun install --frozen-lockfile
      - name: Print exact Prettier output
        run: bunx prettier src/lib/fmipShadow.ts
